<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>JSON no Google Drive</title>
    <!-- Script correto e atualizado do Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <button id="btn-login">Conectar ao Google Drive</button>
    <button id="btn-salvar" disabled>Salvar JSON</button>
    <button id="btn-ler" disabled>Ler JSON</button>
    <pre id="saida"></pre>

    <script>
      //const CLIENT_ID = "473852471364-r4q7p6qcs7tvoov8i1mlie3ju0e13js1.apps.googleusercontent.com://googleusercontent.com";
      const CLIENT_ID = "473852471364-r4q7p6qcs7tvoov8i1mlie3ju0e13js1.apps.googleusercontent.com";

      // CORREÇÃO 1: Escopo correto para Drive
      const SCOPES = "https://www.googleapis.com/auth/drive.file";

      let tokenClient;
      let accessToken = null;
      let fileId = null;

      window.onload = () => {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: (response) => {
            if (response.error) {
              console.error(response);
              return;
            }
            accessToken = response.access_token;
            document.getElementById("btn-salvar").disabled = false;
            document.getElementById("btn-ler").disabled = false;
            log("Autenticado com sucesso!");
          },
        });
      };

      document.getElementById("btn-login").onclick = () => {
        tokenClient.requestAccessToken();
      };

      document.getElementById("btn-salvar").onclick = async () => {
        const meusDados = {
          usuario: "João",
          atualizadoEm: new Date().toISOString(),
          configuracoes: { tema: "escuro", notificacoes: true },
        };

        const metadata = {
          name: "dados_app.json",
          mimeType: "application/json",
        };

        const form = new FormData();
        form.append(
          "metadata",
          new Blob([JSON.stringify(metadata)], { type: "application/json" }),
        );
        form.append(
          "file",
          new Blob([JSON.stringify(meusDados, null, 2)], {
            type: "application/json",
          }),
        );

        // CORREÇÃO 2 e 3: URLs oficiais da API e sintaxe correta (${fileId})
        const url = fileId
          ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
          : "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";

        const method = fileId ? "PATCH" : "POST";

        try {
          const res = await fetch(url, {
            method: method,
            headers: { Authorization: `Bearer ${accessToken}` },
            body: form,
          });

          const data = await res.json();
          fileId = data.id;
          log(`Arquivo salvo! ID: ${fileId}`);
        } catch (err) {
          log("Erro ao salvar: " + err.message);
        }
      };

      document.getElementById("btn-ler").onclick = async () => {
        if (!fileId) {
          log("Salve um arquivo primeiro (ou busque pelo nome).");
          return;
        }

        // CORREÇÃO 2 e 3: URL oficial para leitura e sintaxe ${fileId}
        const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`;

        try {
          const res = await fetch(url, {
            headers: { Authorization: `Bearer ${accessToken}` },
          });

          const jsonLido = await res.json();
          log("Conteúdo lido do Drive:\n" + JSON.stringify(jsonLido, null, 2));
        } catch (err) {
          log("Erro ao ler: " + err.message);
        }
      };

      function log(texto) {
        document.getElementById("saida").textContent = texto;
      }
    </script>
  </body>
</html>
